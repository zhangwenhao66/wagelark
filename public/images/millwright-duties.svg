<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Arial, sans-serif">
	<rect width="640" height="220" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">What Millwrights Do, Per BLS</text>

	<g font-size="13" fill="#14212e">
		<rect x="10" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="82" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Install</text>
		<text x="82" y="105" text-anchor="middle" font-size="11.5">New machines in</text>
		<text x="82" y="120" text-anchor="middle" font-size="11.5">factories, plants</text>

		<rect x="165" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="237" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Disassemble</text>
		<text x="237" y="105" text-anchor="middle" font-size="11.5">Sort and package</text>
		<text x="237" y="120" text-anchor="middle" font-size="11.5">each part</text>

		<rect x="320" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="392" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Repair</text>
		<text x="392" y="105" text-anchor="middle" font-size="11.5">Replace worn or</text>
		<text x="392" y="120" text-anchor="middle" font-size="11.5">defective parts</text>

		<rect x="475" y="55" width="155" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="552" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Move</text>
		<text x="552" y="105" text-anchor="middle" font-size="11.5">Forklifts, hoists,</text>
		<text x="552" y="120" text-anchor="middle" font-size="11.5">cranes, winches</text>
	</g>

	<text x="320" y="190" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">Millwrights are one of three titles BLS tracks under a single SOC group. Source: BLS Occupational Outlook Handbook.</text>
</svg>
