<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
	<rect width="640" height="360" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Dentist</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="50" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Bachelor's degree (4 years)</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">No specific major required, but programs favor applicants with science</text>
		<text x="320" y="98" text-anchor="middle" font-size="11">coursework such as biology or chemistry (BLS)</text>
		<line x1="320" y1="96" x2="320" y2="118" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="118" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="138" text-anchor="middle" font-weight="700" fill="#0b675e">DDS or DMD at a CODA-accredited dental school (4 years)</text>
		<text x="320" y="155" text-anchor="middle" font-size="11.5">DAT required for admission; coursework plus supervised clinical work</text>
		<text x="320" y="169" text-anchor="middle" font-size="11">with patients (BLS; ADA)</text>
		<line x1="320" y1="174" x2="320" y2="196" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="196" width="580" height="50" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="216" text-anchor="middle" font-weight="700" fill="#0b675e">INBDE plus a state or regional clinical exam</text>
		<text x="320" y="233" text-anchor="middle" font-size="11.5">ADEX clinical exam accepted in 48 states, D.C., and Puerto Rico as of Aug 2026 (ABDE)</text>
		<line x1="320" y1="246" x2="320" y2="268" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="268" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="288" text-anchor="middle" font-weight="700" fill="white">Licensed dentist</text>
		<text x="320" y="305" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $179,210/yr (BLS, May 2024)</text>
	</g>

	<text x="320" y="332" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">BLS puts the typical total timeline at 8 years of full-time study after high school</text>
	<text x="320" y="350" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; American Dental Association; Joint Commission on National Dental Examinations.</text>
</svg>
