<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Arial, sans-serif">
	<rect width="640" height="350" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path Through a Plumbing Apprenticeship</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="48" width="580" height="44" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="67" text-anchor="middle" font-weight="700" fill="#0b675e">High school diploma or equivalent</text>
		<text x="320" y="84" text-anchor="middle" font-size="11.5">No postsecondary degree required to start; some enter via a vocational-technical program first</text>
		<line x1="320" y1="92" x2="320" y2="114" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="114" width="580" height="52" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="134" text-anchor="middle" font-weight="700" fill="#0b675e">4- to 5-year apprenticeship</text>
		<text x="320" y="151" text-anchor="middle" font-size="11.5">About 2,000 hrs paid on-the-job training per year, plus technical instruction</text>
		<text x="320" y="164" text-anchor="middle" font-size="11">(codes, blueprint reading, math, applied physics and chemistry)</text>
		<line x1="320" y1="166" x2="320" y2="188" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="188" width="580" height="50" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="208" text-anchor="middle" font-weight="700" fill="#0b675e">State licensing exam</text>
		<text x="320" y="225" text-anchor="middle" font-size="11.5">Most states and some localities require it; typically 2-5 yrs experience plus a trade-knowledge test</text>
		<line x1="320" y1="238" x2="320" y2="260" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="260" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="280" text-anchor="middle" font-weight="700" fill="white">Journey-level plumber, pipefitter, or steamfitter</text>
		<text x="320" y="297" text-anchor="middle" font-size="11.5" fill="#dcdad2">Qualified to work independently; median $62,970/yr (BLS, May 2024)</text>
		<line x1="320" y1="306" x2="320" y2="322" stroke="#dcdad2" stroke-width="2"/>

		<text x="320" y="336" text-anchor="middle" font-weight="700" fill="#0b675e">Optional: master status after further exam + experience</text>
	</g>

	<text x="320" y="348" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Requirements vary by state. Source: BLS Occupational Outlook Handbook, Plumbers, Pipefitters, and Steamfitters.</text>
</svg>
