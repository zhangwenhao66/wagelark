<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Arial, sans-serif">
	<rect width="640" height="220" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">What an Insurance Underwriter Does, Per BLS</text>

	<g font-size="13" fill="#14212e">
		<rect x="10" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="82" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Analyze</text>
		<text x="82" y="105" text-anchor="middle" font-size="11.5">Review information on</text>
		<text x="82" y="120" text-anchor="middle" font-size="11.5">an insurance application</text>

		<rect x="165" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="237" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Assess risk</text>
		<text x="237" y="105" text-anchor="middle" font-size="11.5">Weigh software output</text>
		<text x="237" y="120" text-anchor="middle" font-size="11.5">against underwriting rules</text>

		<rect x="320" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="392" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Decide</text>
		<text x="392" y="105" text-anchor="middle" font-size="11.5">Approve or reject</text>
		<text x="392" y="120" text-anchor="middle" font-size="11.5">the application</text>

		<rect x="475" y="55" width="155" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="552" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Set terms</text>
		<text x="552" y="105" text-anchor="middle" font-size="11.5">Determine premiums</text>
		<text x="552" y="120" text-anchor="middle" font-size="11.5">and coverage amounts</text>
	</g>

	<text x="320" y="190" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">Criteria vary by specialty (health, life, property and casualty). Source: BLS Occupational Outlook Handbook.</text>
</svg>
