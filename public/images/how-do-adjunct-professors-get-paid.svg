<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">One hypothetical $4,000 course fee</title><desc id="desc">100 total work hours gives $40 per hour; 200 gives $20; 300 gives $13.33. All inputs are assumptions, not a pay survey.</desc><rect width="1000" height="520" fill="#faf9f5"/><g font-family="Arial,sans-serif" fill="#14273f"><text x="60" y="70" font-size="32">One hypothetical $4,000 course fee</text><text x="60" y="112" font-size="22">Include all work hours when comparing the rate</text><text x="60" y="198" font-size="24">100 hours</text><text x="60" y="298" font-size="24">200 hours</text><text x="60" y="398" font-size="24">300 hours</text><rect x="250" y="162" width="540" height="50" fill="#0f8b7f"/><rect x="250" y="262" width="270" height="50" fill="#0f8b7f"/><rect x="250" y="362" width="180" height="50" fill="#0f8b7f"/><text x="810" y="197" font-size="24">$40/hr</text><text x="540" y="297" font-size="24">$20/hr</text><text x="450" y="397" font-size="24">$13.33/hr</text><text x="60" y="470" font-size="20">Assumed fee and work hours; gross pay before deductions.</text></g></svg>