<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Arial, sans-serif">
	<rect width="640" height="220" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">What a Paralegal Does, Under Attorney Supervision</text>

	<g font-size="13" fill="#14212e">
		<rect x="10" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="82" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Research</text>
		<text x="82" y="105" text-anchor="middle" font-size="11.5">Case facts, statutes,</text>
		<text x="82" y="120" text-anchor="middle" font-size="11.5">case law</text>

		<rect x="165" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="237" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Draft</text>
		<text x="237" y="105" text-anchor="middle" font-size="11.5">Contracts, filings,</text>
		<text x="237" y="120" text-anchor="middle" font-size="11.5">correspondence</text>

		<rect x="320" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="392" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Organize</text>
		<text x="392" y="105" text-anchor="middle" font-size="11.5">Case files,</text>
		<text x="392" y="120" text-anchor="middle" font-size="11.5">affidavits</text>

		<rect x="475" y="55" width="155" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="552" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Trial support</text>
		<text x="552" y="105" text-anchor="middle" font-size="11.5">Court filings,</text>
		<text x="552" y="120" text-anchor="middle" font-size="11.5">scheduling</text>
	</g>

	<text x="320" y="190" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">Paralegals cannot give legal advice or represent clients in court. Source: BLS Occupational Outlook Handbook.</text>
</svg>
