<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="Arial, sans-serif">
	<rect width="640" height="490" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Court Reporter or Simultaneous Captioner</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="70" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Postsecondary certificate or associate's degree (2-3 years)</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">At a community college or technical institute (BLS)</text>
		<text x="320" y="99" text-anchor="middle" font-size="11">Courses in English grammar, legal terminology, transcript practice</text>
		<line x1="320" y1="116" x2="320" y2="138" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="138" width="580" height="70" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="158" text-anchor="middle" font-weight="700" fill="#0b675e">Pick a reporting method</text>
		<text x="320" y="175" text-anchor="middle" font-size="11.5">Stenotype machine, voice-writing, or digital/electronic recording</text>
		<text x="320" y="191" text-anchor="middle" font-size="11">Equipment training varies by method and school program (BLS)</text>
		<line x1="320" y1="208" x2="320" y2="230" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="230" width="580" height="70" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="250" text-anchor="middle" font-weight="700" fill="#0b675e">State license or professional certification</text>
		<text x="320" y="267" text-anchor="middle" font-size="11.5">Written test plus a typing/transcription skills test</text>
		<text x="320" y="283" text-anchor="middle" font-size="11">Required by many states for legal-setting work; requirements vary by state (BLS)</text>
		<line x1="320" y1="300" x2="320" y2="322" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="322" width="580" height="54" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="342" text-anchor="middle" font-weight="700" fill="#0b675e">On-the-job training</text>
		<text x="320" y="359" text-anchor="middle" font-size="11.5">Length varies by type of reporting or captioning (BLS)</text>
		<line x1="320" y1="376" x2="320" y2="398" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="398" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="418" text-anchor="middle" font-weight="700" fill="white">Working court reporter or simultaneous captioner</text>
		<text x="320" y="435" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $67,310/yr (BLS, May 2024)</text>
	</g>

	<text x="320" y="460" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">Job outlook is flat: BLS projects 0% employment change through 2034, but ~1,700 openings a year from replacement need.</text>
	<text x="320" y="478" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Source: BLS Occupational Outlook Handbook, Court Reporters and Simultaneous Captioners (May 2024 data).</text>
</svg>
