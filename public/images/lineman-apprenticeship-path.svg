<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
	<rect width="640" height="380" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Lineman</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="44" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="65" text-anchor="middle" font-weight="700" fill="#0b675e">High school diploma or equivalent (BLS)</text>
		<text x="320" y="82" text-anchor="middle" font-size="11.5">No postsecondary degree required to enter the occupation</text>
		<line x1="320" y1="90" x2="320" y2="112" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="112" width="580" height="52" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="132" text-anchor="middle" font-weight="700" fill="#0b675e">Apply: driver's license, aptitude test, age 18+</text>
		<text x="320" y="149" text-anchor="middle" font-size="11.5">The two reviewed sponsors both require a CDL or a passed CDL physical</text>
		<text x="320" y="161" text-anchor="middle" font-size="11">Requirements are set by each apprenticeship sponsor, not one national standard</text>
		<line x1="320" y1="164" x2="320" y2="186" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="186" width="580" height="60" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="206" text-anchor="middle" font-weight="700" fill="#0b675e">Apprenticeship: about 7,000 hours of paid on-the-job training</text>
		<text x="320" y="223" text-anchor="middle" font-size="11.5">Roughly 3 to 4 years depending on the sponsor, plus related classroom instruction</text>
		<text x="320" y="238" text-anchor="middle" font-size="11">Two independently reviewed regional programs both report a 7,000-hour term</text>
		<line x1="320" y1="246" x2="320" y2="268" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="268" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="288" text-anchor="middle" font-weight="700" fill="white">Journeyman lineman</text>
		<text x="320" y="305" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $92,560/yr (BLS, May 2024)</text>
	</g>

	<text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">Apprenticeships are sponsored by unions, utilities, and contractors, not run as one program</text>
	<text x="320" y="354" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; Southwest Line Constructors apprenticeship standards;</text>
	<text x="320" y="368" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">IBEW Local 1186 (Hawaii) Electricians Training Fund.</text>
</svg>
