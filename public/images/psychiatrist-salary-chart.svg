	<rect x="150" y="62" width="380" height="34" fill="#dcdad2" />
	<rect x="150" y="62" width="380" height="34" fill="#0f8b7f" />
	<text x="540" y="85" font-size="15" font-weight="700" fill="#14273f">$281,870</text>

	<text x="138" y="140" text-anchor="end" font-size="15" fill="#14212e">Physicians overall</text>
	<rect x="150" y="122" width="380" height="34" fill="#dcdad2" />
	<rect x="150" y="122" width="372" height="34" fill="#0f8b7f" />
	<text x="532" y="145" font-size="15" font-weight="700" fill="#14273f">$275,930</text>

