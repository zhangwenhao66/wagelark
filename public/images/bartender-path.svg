<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
	<rect width="640" height="380" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Bartender</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">No formal education required</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">Some employers prefer a high school diploma, but BLS lists none as typical (BLS)</text>
		<line x1="320" y1="92" x2="320" y2="114" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="114" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="134" text-anchor="middle" font-weight="700" fill="#0b675e">Entry role or bartending course (optional)</text>
		<text x="320" y="151" text-anchor="middle" font-size="11.5">Food-service experience, or a barback role, is common; some attend a</text>
		<text x="320" y="165" text-anchor="middle" font-size="11">bartending school or community-college course first (BLS)</text>
		<line x1="320" y1="170" x2="320" y2="192" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="192" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="212" text-anchor="middle" font-weight="700" fill="#0b675e">On-the-job training, a few weeks</text>
		<text x="320" y="229" text-anchor="middle" font-size="11.5">Recipes, bar setup, and customer service under an experienced</text>
		<text x="320" y="243" text-anchor="middle" font-size="11">bartender; most states require servers to be 18 or older (BLS)</text>
		<line x1="320" y1="248" x2="320" y2="270" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="270" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="290" text-anchor="middle" font-weight="700" fill="white">Working bartender, once state server training is complete</text>
		<text x="320" y="307" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $33,530/yr, tips included (BLS, May 2024)</text>
	</g>

	<text x="320" y="335" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">Many states require a responsible-server course; the specific program varies by state</text>
	<text x="320" y="353" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; state alcohol control agencies (e.g., TABC, ABC).</text>
</svg>
