<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
	<rect width="640" height="460" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Social Worker</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Bachelor's degree in social work, or any field (4 years)</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">A BSW is the most common path into entry-level, nonclinical roles (BLS)</text>
		<line x1="320" y1="92" x2="320" y2="114" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="114" width="580" height="62" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="134" text-anchor="middle" font-weight="700" fill="#0b675e">Master's degree in social work (MSW), CSWE-accredited</text>
		<text x="320" y="151" text-anchor="middle" font-size="11.5">Required for clinical practice; generally 2 years with a supervised practicum (BLS)</text>
		<text x="320" y="167" text-anchor="middle" font-size="11">A BSW is not required to enter an MSW program (BLS)</text>
		<line x1="320" y1="176" x2="320" y2="198" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="198" width="580" height="52" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="218" text-anchor="middle" font-weight="700" fill="#0b675e">Supervised clinical experience</text>
		<text x="320" y="235" text-anchor="middle" font-size="11.5">Minimum 104 weeks (2 years) and 3,000 hours in California; varies by state (CA BBS)</text>
		<line x1="320" y1="250" x2="320" y2="272" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="272" width="580" height="62" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="292" text-anchor="middle" font-weight="700" fill="#0b675e">State licensure, including an ASWB exam</text>
		<text x="320" y="309" text-anchor="middle" font-size="11.5">Bachelors, Masters, Advanced Generalist, or Clinical tier, by degree and scope (ASWB)</text>
		<text x="320" y="325" text-anchor="middle" font-size="11">Clinical practice requires the ASWB Clinical Exam in most states (ASWB)</text>
		<line x1="320" y1="334" x2="320" y2="356" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="356" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="376" text-anchor="middle" font-weight="700" fill="white">Working social worker</text>
		<text x="320" y="393" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $61,330/yr (BLS, May 2024)</text>
	</g>

	<text x="320" y="420" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">BLS does not publish one total-year figure; nonclinical entry is faster than the clinical, MSW-and-license track</text>
	<text x="320" y="438" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; Association of Social Work Boards (ASWB); California Board of Behavioral Sciences.</text>
</svg>
