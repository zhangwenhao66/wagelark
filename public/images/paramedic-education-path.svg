<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" font-family="Arial, sans-serif">
	<rect width="640" height="530" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Paramedic</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="62" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">EMT-Basic certification (under 1 year)</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">Patient assessment, field equipment, basic emergency care (BLS)</text>
		<line x1="320" y1="108" x2="320" y2="130" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="130" width="580" height="62" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="150" text-anchor="middle" font-weight="700" fill="#0b675e">EMT-Intermediate certification (up to 2 years)</text>
		<text x="320" y="167" text-anchor="middle" font-size="11.5">Advanced airway devices, IV fluids, some medications (BLS)</text>
		<line x1="320" y1="192" x2="320" y2="214" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="214" width="580" height="70" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="234" text-anchor="middle" font-weight="700" fill="#0b675e">Paramedic postsecondary program</text>
		<text x="320" y="251" text-anchor="middle" font-size="11.5">Anatomy, EKG interpretation, airway management, supervised field experience</text>
		<text x="320" y="267" text-anchor="middle" font-size="11">Nondegree award or associate's degree; some 4-year bachelor's programs (BLS)</text>
		<line x1="320" y1="284" x2="320" y2="306" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="306" width="580" height="62" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="326" text-anchor="middle" font-weight="700" fill="#0b675e">State licensing exam</text>
		<text x="320" y="343" text-anchor="middle" font-size="11.5">Certification or an equivalent state exam; requirements vary by state (BLS)</text>
		<line x1="320" y1="368" x2="320" y2="390" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="390" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="410" text-anchor="middle" font-weight="700" fill="white">Working paramedic</text>
		<text x="320" y="427" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $58,410/yr (BLS, May 2024)</text>
	</g>

	<text x="320" y="460" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">Each level requires the one before it: paramedic programs require EMT-Intermediate certification first.</text>
	<text x="320" y="480" text-anchor="middle" font-size="11" fill="#14212e">With additional education, BLS notes some paramedics move into other healthcare roles via paramedic-to-RN bridge programs.</text>
	<text x="320" y="504" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Source: BLS Occupational Outlook Handbook, EMTs and Paramedics (May 2024 data).</text>
</svg>
