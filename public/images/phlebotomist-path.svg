<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Arial, sans-serif">
	<rect width="640" height="260" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Two Paths to Becoming a Phlebotomist</text>

	<g font-size="12.5" fill="#14212e">
		<!-- Path A -->
		<rect x="30" y="55" width="230" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="145" y="83" text-anchor="middle" font-weight="700" fill="#0b675e">Certificate program (&lt;1 yr)</text>
		<line x1="145" y1="101" x2="145" y2="130" stroke="#dcdad2" stroke-width="2"/>

		<!-- Path B -->
		<rect x="380" y="55" width="230" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="495" y="83" text-anchor="middle" font-weight="700" fill="#0b675e">HS diploma + employer OJT</text>
		<line x1="495" y1="101" x2="495" y2="130" stroke="#dcdad2" stroke-width="2"/>

		<!-- converge -->
		<line x1="145" y1="130" x2="320" y2="150" stroke="#dcdad2" stroke-width="2"/>
		<line x1="495" y1="130" x2="320" y2="150" stroke="#dcdad2" stroke-width="2"/>

		<rect x="200" y="150" width="240" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="178" text-anchor="middle" font-weight="700" fill="white">Certification (recommended)</text>

		<line x1="320" y1="196" x2="320" y2="220" stroke="#dcdad2" stroke-width="2"/>
		<rect x="170" y="220" width="300" height="4" fill="none"/>
		<text x="320" y="240" text-anchor="middle" font-weight="700" fill="#0b675e">Working phlebotomist: median $43,660/yr</text>
	</g>

	<text x="320" y="255" text-anchor="middle" font-size="11.5" fill="#14212e" opacity="0.55">Some states require certification/license by law regardless of path. Source: BLS Occupational Outlook Handbook.</text>
</svg>
