<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
	<rect width="640" height="360" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Lawyer</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="50" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Bachelor's degree (4 years)</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">No specific major required; common fields include law and legal studies,</text>
		<text x="320" y="98" text-anchor="middle" font-size="11">history, and social science (BLS)</text>
		<line x1="320" y1="96" x2="320" y2="118" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="118" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="138" text-anchor="middle" font-weight="700" fill="#0b675e">Juris Doctor (J.D.) at an accredited law school (3 years)</text>
		<text x="320" y="155" text-anchor="middle" font-size="11.5">Constitutional law, contracts, property law, civil procedure, legal writing</text>
		<text x="320" y="169" text-anchor="middle" font-size="11">Most states require ABA accreditation; California allows other paths (BLS; CA Bar)</text>
		<line x1="320" y1="174" x2="320" y2="196" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="196" width="580" height="50" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="216" text-anchor="middle" font-weight="700" fill="#0b675e">State bar exam</text>
		<text x="320" y="233" text-anchor="middle" font-size="11.5">Legacy Uniform Bar Examination (UBE) in 35 jurisdictions as of Aug 2026 (NCBE)</text>
		<line x1="320" y1="246" x2="320" y2="268" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="268" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="288" text-anchor="middle" font-weight="700" fill="white">Licensed lawyer, admitted to the bar</text>
		<text x="320" y="305" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $151,160/yr (BLS, May 2024)</text>
	</g>

	<text x="320" y="332" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">BLS puts the typical total timeline at 7 years of full-time study after high school</text>
	<text x="320" y="350" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; NCBE; State Bar of California.</text>
</svg>
