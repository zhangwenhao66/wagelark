<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Arial, sans-serif">
	<rect width="640" height="220" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">What a Home Health Aide Does, Per BLS</text>

	<g font-size="13" fill="#14212e">
		<rect x="10" y="55" width="145" height="100" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="82" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Assist</text>
		<text x="82" y="105" text-anchor="middle" font-size="11.5">Bathing, dressing, and</text>
		<text x="82" y="120" text-anchor="middle" font-size="11.5">other daily personal</text>
		<text x="82" y="135" text-anchor="middle" font-size="11.5">tasks</text>

		<rect x="165" y="55" width="145" height="100" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="237" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Support</text>
		<text x="237" y="105" text-anchor="middle" font-size="11.5">Housekeeping, meals,</text>
		<text x="237" y="120" text-anchor="middle" font-size="11.5">and shopping for</text>
		<text x="237" y="135" text-anchor="middle" font-size="11.5">groceries</text>

		<rect x="320" y="55" width="145" height="100" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="392" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Monitor</text>
		<text x="392" y="105" text-anchor="middle" font-size="11.5">Vital signs and basic</text>
		<text x="392" y="120" text-anchor="middle" font-size="11.5">care, under a nurse's</text>
		<text x="392" y="135" text-anchor="middle" font-size="11.5">direction</text>

		<rect x="475" y="55" width="155" height="100" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="552" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Coordinate</text>
		<text x="552" y="105" text-anchor="middle" font-size="11.5">Appointments,</text>
		<text x="552" y="120" text-anchor="middle" font-size="11.5">transportation, and</text>
		<text x="552" y="135" text-anchor="middle" font-size="11.5">social engagement</text>
	</g>

	<text x="320" y="190" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">"Monitor" duties vary by state and by employer. Source: BLS Occupational Outlook Handbook.</text>
</svg>
