<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
	<rect width="640" height="420" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Flight Attendant</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Meet eligibility requirements</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">High school diploma, age 18-21 depending on airline, valid passport,</text>
		<text x="320" y="97" text-anchor="middle" font-size="11">background check, drug test, and 1-2 years of service experience (BLS)</text>
		<line x1="320" y1="102" x2="320" y2="124" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="124" width="580" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="144" text-anchor="middle" font-weight="700" fill="#0b675e">Get hired by an airline</text>
		<text x="320" y="161" text-anchor="middle" font-size="11.5">No pre-hire school required; some attend a flight attendant academy first (BLS)</text>
		<line x1="320" y1="170" x2="320" y2="192" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="192" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="212" text-anchor="middle" font-weight="700" fill="#0b675e">Initial training, several weeks to a few months</text>
		<text x="320" y="229" text-anchor="middle" font-size="11.5">Emergency procedures, evacuation, first aid, and practice flights at the</text>
		<text x="320" y="243" text-anchor="middle" font-size="11">airline's own training center; must pass to keep the job (BLS)</text>
		<line x1="320" y1="248" x2="320" y2="270" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="270" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="290" text-anchor="middle" font-weight="700" fill="#0b675e">FAA Certificate of Demonstrated Proficiency</text>
		<text x="320" y="307" text-anchor="middle" font-size="11.5">Required by federal law (14 CFR 121/135) before working; certified per</text>
		<text x="320" y="321" text-anchor="middle" font-size="11">aircraft type, with annual recurrent training after (FAA)</text>
		<line x1="320" y1="326" x2="320" y2="348" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="348" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="368" text-anchor="middle" font-weight="700" fill="white">Working flight attendant</text>
		<text x="320" y="385" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $67,130/yr; pay range widens sharply with seniority (BLS, May 2024)</text>
	</g>

	<text x="320" y="411" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; Federal Aviation Administration.</text>
</svg>
