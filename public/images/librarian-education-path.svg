<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
	<rect width="640" height="380" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Librarian</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Bachelor's degree (4 years)</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">Any major; a bachelor's is the entry requirement for MLS/MLIS programs (BLS)</text>
		<line x1="320" y1="92" x2="320" y2="114" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="114" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="134" text-anchor="middle" font-weight="700" fill="#0b675e">Master's in Library Science, MLS or MLIS (1 to 2 years)</text>
		<text x="320" y="151" text-anchor="middle" font-size="11.5">Research methods, reference systems, information organization (BLS)</text>
		<text x="320" y="165" text-anchor="middle" font-size="11">Most librarian positions require an ALA-accredited program (ALA)</text>
		<line x1="320" y1="170" x2="320" y2="192" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="192" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="212" text-anchor="middle" font-weight="700" fill="#0b675e">State licensing, if the setting requires it</text>
		<text x="320" y="229" text-anchor="middle" font-size="11.5">School librarians typically need teacher certification, sometimes a Praxis</text>
		<text x="320" y="243" text-anchor="middle" font-size="11">exam; some states also certify public-library librarians (BLS)</text>
		<line x1="320" y1="248" x2="320" y2="270" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="270" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="290" text-anchor="middle" font-weight="700" fill="white">Working librarian or media collections specialist</text>
		<text x="320" y="307" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $64,320/yr (BLS, May 2024)</text>
	</g>

	<text x="320" y="335" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">BLS puts the typical total timeline at about 6 years of full-time study after high school</text>
	<text x="320" y="353" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; American Library Association.</text>
</svg>
