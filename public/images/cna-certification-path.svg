<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, sans-serif">
	<rect width="640" height="300" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to CNA Certification</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="50" width="580" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="70" text-anchor="middle" font-weight="700" fill="#0b675e">State-approved training program</text>
		<text x="320" y="87" text-anchor="middle" font-size="11.5">75-hour federal minimum, incl. 16 hrs supervised practical training (42 CFR 483.152)</text>
		<line x1="320" y1="96" x2="320" y2="120" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="120" width="580" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="140" text-anchor="middle" font-weight="700" fill="#0b675e">State competency evaluation</text>
		<text x="320" y="157" text-anchor="middle" font-size="11.5">Written/oral test + skills demo, within 4 months of starting work (42 CFR 483.35(d))</text>
		<line x1="320" y1="166" x2="320" y2="190" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="190" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="210" text-anchor="middle" font-weight="700" fill="white">Placed on state nurse aide registry</text>
		<text x="320" y="227" text-anchor="middle" font-size="11.5" fill="#dcdad2">Within 30 days of passing (42 CFR 483.154(e)(2)) — required to work in a nursing home</text>
		<line x1="320" y1="236" x2="320" y2="260" stroke="#dcdad2" stroke-width="2"/>

		<text x="320" y="280" text-anchor="middle" font-weight="700" fill="#0b675e">Certified nurse aide (CNA) — median $39,530/yr</text>
	</g>

	<text x="320" y="296" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Titles vary by state. Source: 42 CFR Part 483 Subpart D; BLS Occupational Outlook Handbook.</text>
</svg>
