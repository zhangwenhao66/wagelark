<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" font-family="Arial, sans-serif">
	<rect width="660" height="230" fill="white"/>
	<text x="330" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Diagnostic Medical Sonographer</text>

	<line x1="70" y1="115" x2="590" y2="115" stroke="#dcdad2" stroke-width="3"/>

	<g font-size="12.5" fill="#14212e">
		<circle cx="70" cy="115" r="9" fill="#0f8b7f"/>
		<text x="70" y="150" text-anchor="middle" font-weight="700" fill="#0b675e">Step 1</text>
		<text x="70" y="167" text-anchor="middle" font-size="11.5">Associate degree or</text>
		<text x="70" y="182" text-anchor="middle" font-size="11.5">certificate (CAAHEP)</text>
		<text x="70" y="90" text-anchor="middle" font-size="11.5">~2 years</text>

		<circle cx="200" cy="115" r="9" fill="#0f8b7f"/>
		<text x="200" y="150" text-anchor="middle" font-weight="700" fill="#0b675e">Step 2</text>
		<text x="200" y="167" text-anchor="middle" font-size="11.5">Supervised</text>
		<text x="200" y="182" text-anchor="middle" font-size="11.5">clinical training</text>

		<circle cx="330" cy="115" r="9" fill="#0f8b7f"/>
		<text x="330" y="150" text-anchor="middle" font-weight="700" fill="#0b675e">Step 3</text>
		<text x="330" y="167" text-anchor="middle" font-size="11.5">ARDMS</text>
		<text x="330" y="182" text-anchor="middle" font-size="11.5">certification exam</text>

		<circle cx="460" cy="115" r="9" fill="#0f8b7f"/>
		<text x="460" y="150" text-anchor="middle" font-weight="700" fill="#0b675e">Step 4</text>
		<text x="460" y="167" text-anchor="middle" font-size="11.5">State license</text>
		<text x="460" y="182" text-anchor="middle" font-size="11.5">(where required)</text>

		<circle cx="590" cy="115" r="9" fill="#14273f"/>
		<text x="590" y="150" text-anchor="middle" font-weight="700" fill="#14273f">Working</text>
		<text x="590" y="167" text-anchor="middle" font-size="11.5">Sonographer</text>
		<text x="590" y="182" text-anchor="middle" font-size="11.5">Median $89,340/yr</text>
	</g>

	<text x="330" y="220" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">Source: BLS Occupational Outlook Handbook, May 2024 wage data.</text>
</svg>
