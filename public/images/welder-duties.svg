<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Arial, sans-serif">
	<rect width="640" height="220" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">What a Welder Does, Per BLS</text>

	<g font-size="13" fill="#14212e">
		<rect x="10" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="82" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Read</text>
		<text x="82" y="105" text-anchor="middle" font-size="11.5">Interpret blueprints</text>
		<text x="82" y="120" text-anchor="middle" font-size="11.5">and specifications</text>

		<rect x="165" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="237" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Measure</text>
		<text x="237" y="105" text-anchor="middle" font-size="11.5">Calculate dimensions</text>
		<text x="237" y="120" text-anchor="middle" font-size="11.5">and inspect materials</text>

		<rect x="320" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="392" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Weld</text>
		<text x="392" y="105" text-anchor="middle" font-size="11.5">Join or cut metal while</text>
		<text x="392" y="120" text-anchor="middle" font-size="11.5">monitoring the heat</text>

		<rect x="475" y="55" width="155" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="552" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Maintain</text>
		<text x="552" y="105" text-anchor="middle" font-size="11.5">Care for equipment</text>
		<text x="552" y="120" text-anchor="middle" font-size="11.5">and machinery</text>
	</g>

	<text x="320" y="190" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">Covers welders, cutters, solderers, and brazers. Source: BLS Occupational Outlook Handbook.</text>
</svg>
