<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
	<rect width="640" height="460" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a School Counselor</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="46" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Bachelor's degree (4 years)</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">Any major typically accepted; psychology, education, or social science are common (BLS)</text>
		<line x1="320" y1="92" x2="320" y2="114" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="114" width="580" height="62" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="134" text-anchor="middle" font-weight="700" fill="#0b675e">Master's degree in school counseling or a related field</text>
		<text x="320" y="151" text-anchor="middle" font-size="11.5">Required in nearly every state and D.C. for school counselors (BLS)</text>
		<text x="320" y="167" text-anchor="middle" font-size="11">Program typically includes a supervised internship</text>
		<line x1="320" y1="176" x2="320" y2="198" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="198" width="580" height="52" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="218" text-anchor="middle" font-weight="700" fill="#0b675e">Supervised internship or practicum</text>
		<text x="320" y="235" text-anchor="middle" font-size="11.5">Hours set by the state; e.g. Texas requires a 100-hour practicum plus two 300-hour internships (BLS; TEA)</text>
		<line x1="320" y1="250" x2="320" y2="272" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="272" width="580" height="62" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="292" text-anchor="middle" font-weight="700" fill="#0b675e">State-issued credential, plus a certification exam</text>
		<text x="320" y="309" text-anchor="middle" font-size="11.5">Called a certification, license, or endorsement depending on the state (BLS)</text>
		<text x="320" y="325" text-anchor="middle" font-size="11">Many states use the Praxis School Counselor exam; Texas uses its own TExES exam instead</text>
		<line x1="320" y1="334" x2="320" y2="356" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="356" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="376" text-anchor="middle" font-weight="700" fill="white">Working school or career counselor</text>
		<text x="320" y="393" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $64,330/yr (BLS, May 2025)</text>
	</g>

	<text x="320" y="420" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">Credentialing exam and required hours vary by state; BLS does not publish one national timeline</text>
	<text x="320" y="438" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; Texas Education Agency (TEA); ETS Praxis program.</text>
</svg>
