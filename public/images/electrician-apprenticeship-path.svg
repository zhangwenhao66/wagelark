<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Arial, sans-serif">
	<rect width="640" height="480" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#14273f">Two Paths to Becoming a Licensed Electrician</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="44" width="580" height="44" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="63" text-anchor="middle" font-weight="700" fill="#0b675e">High school diploma or equivalent</text>
		<text x="320" y="80" text-anchor="middle" font-size="11">Typical entry-level education per BLS; no postsecondary degree required to start</text>
		<line x1="320" y1="88" x2="320" y2="100" stroke="#dcdad2" stroke-width="2"/>

		<line x1="320" y1="100" x2="167" y2="118" stroke="#dcdad2" stroke-width="2"/>
		<line x1="320" y1="100" x2="472" y2="118" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="118" width="275" height="76" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="167" y="138" text-anchor="middle" font-weight="700" font-size="12" fill="#0b675e">Union path: IBEW / NECA JATC</text>
		<text x="167" y="155" text-anchor="middle" font-size="10.5">~300 local training committees,</text>
		<text x="167" y="169" text-anchor="middle" font-size="10.5">via the Electrical Training Alliance</text>
		<text x="167" y="183" text-anchor="middle" font-size="10.5">Aptitude test (69 Q) + interview</text>

		<rect x="335" y="118" width="275" height="76" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="472" y="138" text-anchor="middle" font-weight="700" font-size="12" fill="#0b675e">Non-union path: IEC / ABC</text>
		<text x="472" y="155" text-anchor="middle" font-size="10.5">50+ local merit-shop chapters</text>
		<text x="472" y="169" text-anchor="middle" font-size="10.5">(Independent Electrical Contractors,</text>
		<text x="472" y="183" text-anchor="middle" font-size="10.5">Associated Builders and Contractors)</text>

		<line x1="167" y1="194" x2="320" y2="212" stroke="#dcdad2" stroke-width="2"/>
		<line x1="472" y1="194" x2="320" y2="212" stroke="#dcdad2" stroke-width="2"/>
		<line x1="320" y1="212" x2="320" y2="224" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="224" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="245" text-anchor="middle" font-weight="700" fill="#0b675e">A 4- to 5-year registered apprenticeship</text>
		<text x="320" y="262" text-anchor="middle" font-size="11">IEC's own program totals ~8,000 hrs paid OJT + 576 hrs classroom over 4 yrs</text>
		<text x="320" y="275" text-anchor="middle" font-size="10.5" opacity="0.75">Prior military or construction experience can shorten the program after testing</text>
		<line x1="320" y1="280" x2="320" y2="300" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="300" width="580" height="50" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="320" text-anchor="middle" font-weight="700" fill="#0b675e">State licensing exam</text>
		<text x="320" y="337" text-anchor="middle" font-size="11">Tests the National Electrical Code plus local rules; exact format set by each state</text>
		<line x1="320" y1="350" x2="320" y2="372" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="372" width="580" height="48" rx="6" fill="#14273f"/>
		<text x="320" y="393" text-anchor="middle" font-weight="700" fill="white">Licensed journey worker</text>
		<text x="320" y="410" text-anchor="middle" font-size="11" fill="#dcdad2">May work independently; median $62,350/yr (BLS, May 2024)</text>
		<line x1="320" y1="420" x2="320" y2="436" stroke="#dcdad2" stroke-width="2"/>

		<text x="320" y="450" text-anchor="middle" font-weight="700" fill="#0b675e" font-size="12">Optional: master electrician after further exams + experience</text>
	</g>

	<text x="320" y="468" text-anchor="middle" font-size="10.5" fill="#14212e" opacity="0.55">Requirements vary by state and local program. Sources: BLS Occupational Outlook Handbook; IEC; Electrical Training Alliance.</text>
</svg>
