<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Arial, sans-serif">
	<rect width="640" height="220" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">What a Dental Hygienist Does, Per BLS</text>

	<g font-size="13" fill="#14212e">
		<rect x="10" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="82" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Assess</text>
		<text x="82" y="105" text-anchor="middle" font-size="11.5">Check for gum disease,</text>
		<text x="82" y="120" text-anchor="middle" font-size="11.5">report to dentist</text>

		<rect x="165" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="237" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Clean &amp; treat</text>
		<text x="237" y="105" text-anchor="middle" font-size="11.5">Remove tartar/plaque,</text>
		<text x="237" y="120" text-anchor="middle" font-size="11.5">apply fluoride/sealants</text>

		<rect x="320" y="55" width="145" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="392" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Image</text>
		<text x="392" y="105" text-anchor="middle" font-size="11.5">Take and develop</text>
		<text x="392" y="120" text-anchor="middle" font-size="11.5">dental x-rays</text>

		<rect x="475" y="55" width="155" height="90" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="552" y="85" text-anchor="middle" font-weight="700" fill="#0b675e">Educate</text>
		<text x="552" y="105" text-anchor="middle" font-size="11.5">Teach brushing and</text>
		<text x="552" y="120" text-anchor="middle" font-size="11.5">flossing technique</text>
	</g>

	<text x="320" y="190" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">Supervision requirements and allowed tasks vary by state. Source: BLS Occupational Outlook Handbook.</text>
</svg>
