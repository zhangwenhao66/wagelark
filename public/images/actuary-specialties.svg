<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Arial, sans-serif">
	<rect width="640" height="260" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Five Actuarial Specialty Tracks</text>

	<g font-size="13" fill="#14212e">
		<rect x="10" y="55" width="120" height="140" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="70" y="80" text-anchor="middle" font-weight="700" fill="#0b675e">Health</text>
		<text x="70" y="105" text-anchor="middle" font-size="11.5">Cost of health &amp;</text>
		<text x="70" y="120" text-anchor="middle" font-size="11.5">long-term care</text>
		<text x="70" y="140" text-anchor="middle" font-size="11.5">policies</text>

		<rect x="140" y="55" width="120" height="140" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="200" y="80" text-anchor="middle" font-weight="700" fill="#0b675e">Life</text>
		<text x="200" y="105" text-anchor="middle" font-size="11.5">Life expectancy</text>
		<text x="200" y="120" text-anchor="middle" font-size="11.5">for annuities &amp;</text>
		<text x="200" y="135" text-anchor="middle" font-size="11.5">life policies</text>

		<rect x="270" y="55" width="120" height="140" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="330" y="80" text-anchor="middle" font-weight="700" fill="#0b675e">Property &amp;</text>
		<text x="330" y="96" text-anchor="middle" font-weight="700" fill="#0b675e">Casualty</text>
		<text x="330" y="120" text-anchor="middle" font-size="11.5">Property loss &amp;</text>
		<text x="330" y="135" text-anchor="middle" font-size="11.5">accident liability</text>

		<rect x="400" y="55" width="120" height="140" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="460" y="80" text-anchor="middle" font-weight="700" fill="#0b675e">Pension &amp;</text>
		<text x="460" y="96" text-anchor="middle" font-weight="700" fill="#0b675e">Retirement</text>
		<text x="460" y="120" text-anchor="middle" font-size="11.5">Pension plans,</text>
		<text x="460" y="135" text-anchor="middle" font-size="11.5">401(k) design</text>

		<rect x="510" y="55" width="120" height="140" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="570" y="80" text-anchor="middle" font-weight="700" fill="#0b675e">Enterprise</text>
		<text x="570" y="96" text-anchor="middle" font-weight="700" fill="#0b675e">Risk Mgmt</text>
		<text x="570" y="120" text-anchor="middle" font-size="11.5">Company-wide</text>
		<text x="570" y="135" text-anchor="middle" font-size="11.5">financial risk</text>
	</g>

	<text x="320" y="230" text-anchor="middle" font-size="12" fill="#14212e" opacity="0.55">Track chosen mainly by which SOA/CAS certification exams an actuary sits for. Source: BLS Occupational Outlook Handbook.</text>
</svg>
