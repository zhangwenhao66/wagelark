	<text x="468.0" y="198" font-size="15" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">$160,020</text>
	<line x1="271.1" y1="46" x2="271.1" y2="218" stroke="#c8442b" stroke-width="2" stroke-dasharray="6 4" />
	<line x1="394.0" y1="46" x2="394.0" y2="218" stroke="#14273f" stroke-width="2" stroke-dasharray="2 3" />
	<text x="279.1" y="234" font-size="12" fill="#c8442b" font-family="Arial, sans-serif">$50,980: median for all US occupations</text>
