<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
	<rect width="640" height="340" fill="white"/>
	<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#14273f">Path to Becoming a Paralegal</text>

	<g font-size="12.5" fill="#14212e">
		<rect x="30" y="46" width="580" height="56" rx="6" fill="#eeece3" stroke="#0f8b7f"/>
		<text x="320" y="66" text-anchor="middle" font-weight="700" fill="#0b675e">Most common: associate's degree or certificate in paralegal studies</text>
		<text x="320" y="83" text-anchor="middle" font-size="11.5">Alternate paths: bachelor's degree (any field) + paralegal certificate,</text>
		<text x="320" y="97" text-anchor="middle" font-size="11">or high school diploma + employer on-the-job training (less common)</text>
		<line x1="320" y1="102" x2="320" y2="124" stroke="#dcdad2" stroke-width="2"/>

		<rect x="30" y="124" width="580" height="46" rx="6" fill="#14273f"/>
		<text x="320" y="144" text-anchor="middle" font-weight="700" fill="white">Entry-level paralegal or legal assistant position</text>
		<text x="320" y="161" text-anchor="middle" font-size="11.5" fill="#dcdad2">Median $61,010/yr (BLS, May 2024)</text>
		<line x1="320" y1="170" x2="320" y2="192" stroke="#dcdad2" stroke-width="2" stroke-dasharray="4,3"/>

		<rect x="30" y="192" width="580" height="60" rx="6" fill="white" stroke="#0f8b7f" stroke-dasharray="5,3"/>
		<text x="320" y="212" text-anchor="middle" font-weight="700" fill="#0b675e">Optional: voluntary certification</text>
		<text x="320" y="229" text-anchor="middle" font-size="11.5">NALA's Certified Paralegal (CP), or NFPA's PCCE / PACE exams</text>
		<text x="320" y="243" text-anchor="middle" font-size="11">Requires passing an exam; maintained through continuing legal education</text>
	</g>

	<text x="320" y="278" text-anchor="middle" font-size="11.5" fill="#14212e" font-weight="700">No U.S. state currently licenses the paralegal occupation</text>
	<text x="320" y="300" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Certification above is voluntary and issued by professional associations, not a government agency.</text>
	<text x="320" y="316" text-anchor="middle" font-size="11" fill="#14212e" opacity="0.55">Sources: BLS Occupational Outlook Handbook; NALA; NFPA.</text>
</svg>
