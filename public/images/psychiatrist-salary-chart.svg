	<text x="150" y="290" font-size="12" fill="#14212e" opacity="0.55">Source: U.S. Bureau of Labor Statistics. Psychiatrists and physicians overall: May 2025. Optometrists: May 2025. Psychologists: May 2024.</text>
</svg>
